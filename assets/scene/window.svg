<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="260" height="320">
  <!-- 窗户：木框 + 十字格 + 玻璃暖光。整套视觉的记忆点 -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6D8"/>
      <stop offset="55%" stop-color="#FFE9B8"/>
      <stop offset="100%" stop-color="#FFD98A"/>
    </linearGradient>
    <clipPath id="glassClip">
      <rect x="26" y="26" width="208" height="268" rx="10"/>
    </clipPath>
  </defs>

  <!-- 外框 -->
  <rect x="10" y="10" width="240" height="300" rx="18" fill="#A9714A"/>
  <rect x="18" y="18" width="224" height="284" rx="14" fill="#8C5A3C"/>

  <!-- 玻璃 -->
  <rect x="26" y="26" width="208" height="268" rx="10" fill="url(#glass)"/>

  <!-- 玻璃反光：一道斜光 -->
  <g clip-path="url(#glassClip)" opacity="0.55">
    <polygon points="40,26 96,26 20,294 -36,294" fill="#FFFFFF"/>
    <polygon points="120,26 152,26 76,294 44,294" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 十字格 -->
  <rect x="124" y="26" width="12" height="268" fill="#8C5A3C"/>
  <rect x="26" y="152" width="208" height="12" fill="#8C5A3C"/>

  <!-- 窗台 -->
  <rect x="0" y="298" width="260" height="22" rx="11" fill="#A9714A"/>
  <rect x="0" y="298" width="260" height="9" rx="4.5" fill="#C08A5E"/>
</svg>
